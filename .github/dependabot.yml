version: 2

updates:

  # Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore (dependencies)"
    assignees:
      - "brunns"
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: "development"
      httpx2:
        patterns:
          - "httpx2"
          - "httpcore2"
      boto:
        patterns:
          - "boto*"
          - "jmespath"
          - "s3transfer"

  # CI/CD - Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "github-actions"
    commit-message:
      prefix: "chore (gha)"
    assignees:
      - "brunns"
    cooldown:
      default-days: 7
    groups:
      all_gha:
        patterns:
          - "*"

  # Docker images
  - package-ecosystem: "docker-compose"
    directory: "/tests"
    schedule:
      interval: "monthly"
    labels:
      - "docker"
    commit-message:
      prefix: "chore (docker)"
    assignees:
      - "brunns"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "monthly"
    labels:
      - "terraform"
    commit-message:
      prefix: "chore (terraform)"
    assignees:
      - "brunns"
    cooldown:
      default-days: 7
